version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.dev
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file: .env.dev
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  redis-data:
